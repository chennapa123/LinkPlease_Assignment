version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: linkplease-db
    environment:
      POSTGRES_DB: linkplease
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linkplease"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
    container_name: linkplease-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/linkplease
      PSEUDOGRAM_API_KEY: ${PSEUDOGRAM_API_KEY:-}
      PSEUDOGRAM_BASE_URL: https://pseudogram-api.onrender.com/
      MAX_RETRY_ATTEMPTS: 5
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
