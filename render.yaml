services:
  - type: web
    name: linkplease-api
    runtime: python
    pythonVersion: 3.13
    
    # Build configuration
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    
    # Environment variables
    envVars:
      - key: PSEUDOGRAM_API_KEY
        scope: run
      - key: DATABASE_URL
        fromDatabase:
          name: linkplease-db
          property: connectionString
      - key: PSEUDOGRAM_BASE_URL
        value: "https://pseudogram-api.onrender.com/"
      - key: MAX_RETRY_ATTEMPTS
        value: "5"
      - key: LOG_LEVEL
        value: "INFO"
    
    # Health check
    healthCheck:
      path: /health
    
    # Auto-deploy from Git
    autoDeploy: true

  - type: pserv
    name: linkplease-db
    runtime: postgres
    ipAllowList: []
    databaseName: linkplease
    databaseUser: postgres
