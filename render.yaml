services:
  - type: web
    name: linkplease-api-v2
    runtime: python

    buildCommand: "pip install -r requirements.txt && PYTHONPATH=. alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"

    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"

      - key: PSEUDOGRAM_API_KEY
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: linkplease-db
          property: connectionString

      - key: PSEUDOGRAM_BASE_URL
        value: "https://pseudogram-api.onrender.com/"

      - key: MAX_RETRY_ATTEMPTS
        value: "5"

      - key: LOG_LEVEL
        value: "INFO"

    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: linkplease-db
    databaseName: linkplease
    user: postgres